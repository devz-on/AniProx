<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AniProx Admin Trial Login</title>
    <meta name="description" content="Enter admin password to open AniProx trial page." />
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-950 text-gray-100 min-h-screen flex items-center justify-center px-4">
    <div class="w-full max-w-md bg-gray-900 border border-gray-800 rounded-xl p-6 space-y-4">
      <h1 class="text-xl font-bold">Admin Trial Access</h1>
      <p class="text-sm text-gray-300">
        Enter the admin password to open the proxy trial player.
      </p>

      <form method="POST" action="/admin-trial/login" class="space-y-3">
        <div>
          <label for="password" class="block text-xs text-gray-300 mb-1">Password</label>
          <input
            id="password"
            name="password"
            type="password"
            required
            autocomplete="current-password"
            class="w-full rounded-sm bg-gray-800 border border-gray-700 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
          />
        </div>
        <button
          type="submit"
          class="w-full rounded-sm bg-blue-600 hover:bg-blue-500 px-3 py-2 text-sm font-semibold"
        >
          Continue
        </button>
      </form>

      <a href="/" class="inline-block text-xs text-gray-400 hover:text-gray-200">Back to Documentation</a>
    </div>
  </body>
</html>
