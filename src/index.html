<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>M3U8 Proxy Admin Trial</title>
    <meta name="description" content="Admin trial page for testing m3u8 proxy." />
    <meta property="og:title" content="M3U8 Proxy Admin Trial" />
    <meta
      property="og:description"
      content="Admin trial page for testing m3u8 proxy."
    />

    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  </head>

  <body
    class="bg-gray-900 text-white min-h-screen flex items-center justify-center px-4 py-8"
  >
    <div
      class="w-full max-w-screen-xl bg-gray-800 rounded-xl shadow-lg p-6 space-y-6"
    >
      <div>
          <div class="flex items-center justify-between gap-3 flex-wrap">
            <h1 class="text-3xl font-bold mb-2">M3U8 Proxy Admin Trial</h1>
            <div class="flex items-center gap-2">
              <a href="/" class="text-xs bg-gray-700 hover:bg-gray-600 px-2 py-1 rounded-sm">Docs</a>
              <a href="/admin-trial/logout" class="text-xs bg-red-700 hover:bg-red-600 px-2 py-1 rounded-sm"
                >Logout</a
              >
            </div>
          </div>
          <p class="text-sm text-gray-400">Paste your M3U8 URL and optional referer.</p>
        </div>

      <div class="space-y-4">
        <!-- URL Input -->
        <div>
          <label for="url" class="block text-sm font-medium text-gray-300 mb-1"
            >M3U8 URL</label
          >
          <input
            type="text"
            id="url"
            class="w-full bg-gray-700 border border-gray-600 rounded-sm px-2 py-2 text-white focus:outline-none focus:ring-2 focus:ring-blue-500"
            value="https://tubeplx.viddsn.cfd/anime/eccbc87e4b5ce2fe28308fd9f2a7baf3/98960e8859d29683ad5984c4bae288af/master.m3u8"
          />
        </div>

        <!-- Referer Input -->
        <div>
          <label for="referer" class="block text-sm font-medium text-gray-300 mb-1">Referer (optional)</label>
          <input
            type="text"
            id="referer"
            class="w-full bg-gray-700 border border-gray-600 rounded-sm px-2 py-2 text-white focus:outline-none focus:ring-2 focus:ring-blue-500"
            value="https://vidwish.live/"
          />
        </div>

        <!-- Extra Headers Input -->
        <div>
          <label for="headers" class="block text-sm font-medium text-gray-300 mb-1">Extra Headers (JSON)</label>
          <textarea
            id="headers"
            class="w-full bg-gray-700 border border-gray-600 rounded-sm px-2 py-2 text-white h-12 resize-none focus:outline-none focus:ring-2 focus:ring-blue-500"
          >{}</textarea>
        </div>

        <!-- Button -->
        <button
          onclick="copy()"
          id="copy"
          class="w-full copy bg-yellow-600 hover:bg-yellow-700 text-white font-bold py-2 px-4 rounded-sm transition"
        >
          copy url
        </button>
        <button
          onclick="test()"
          class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-sm transition"
        >
          Play Stream
        </button>

        <!-- Video -->
        <div class="mt-6">
          <video
            id="hls"
            controls
            class="w-full rounded-md aspect-video bg-black"
          ></video>
        </div>
      </div>
    </div>

    <script>
      function copy() {
        const url = document.getElementById("url").value;
        const referer = document.getElementById("referer").value.trim();
        let headers = document.getElementById("headers").value;
        const copy = document.getElementById("copy");

        let parsedHeaders = {};
        try {
          parsedHeaders = JSON.parse(headers || "{}");
        } catch (e) {
          parsedHeaders = {};
        }
        if (referer && !parsedHeaders.referer) {
          parsedHeaders.referer = referer;
        }

        const properUrl = `${window.location.origin}/m3u8-proxy?url=${encodeURIComponent(
          url
        )}&referer=${encodeURIComponent(referer)}&headers=${encodeURIComponent(
          JSON.stringify(parsedHeaders)
        )}`;

        copy.textContent = "copied!";
        setTimeout(() => {
          copy.textContent = "copy url";
        }, 1000);
        navigator.clipboard.writeText(properUrl);
      }
      function test() {
        const url = document.getElementById("url").value;
        const referer = document.getElementById("referer").value.trim();
        let headers = document.getElementById("headers").value;

        try {
          headers = JSON.parse(headers);
        } catch (e) {
          headers = {};
          alert("Invalid JSON in headers. Reset to {}.");
        }
        if (referer && !headers.referer) {
          headers.referer = referer;
        }

        console.log("Using URL:", url);
        console.log("Using Headers:", headers);

        const proxyURL = `/m3u8-proxy?url=${encodeURIComponent(url)}&referer=${encodeURIComponent(
          referer
        )}&headers=${encodeURIComponent(JSON.stringify(headers))}`;
        if (Hls.isSupported()) {
          const video = document.getElementById("hls");
          const hls = new Hls();

          hls.loadSource(proxyURL);
          hls.attachMedia(video);
          hls.on(Hls.Events.MANIFEST_PARSED, function () {
            console.log("Loaded stream from:", proxyURL);
          });
        }
      }
    </script>
  </body>
</html>
